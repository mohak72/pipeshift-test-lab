name: CI Pipeline

on:
  push:
    branches:
      - main

env:
  APP_NAME: pipeshift-test-lab

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install
        run: npm ci || npm install
      
      - name: Lint
        run: npm run lint
      
      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install
        run: npm ci || npm install
      
      - name: Build
        run: npm run build