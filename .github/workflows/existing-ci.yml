# Collision fixture. Migration must NEVER overwrite this file: a migrated
# Jenkinsfile has to land as jenkins-migrated.yml or similar, leaving this one
# byte-for-byte intact.
name: Existing CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
