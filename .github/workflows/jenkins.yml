name: pipeshift-test-lab CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  APP_NAME: pipeshift-test-lab
  NODE_VERSION: '20'

jobs:
  checkout-and-install:
    name: Checkout and Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Cache node modules
        uses: actions/cache/save@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checkout-and-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node modules
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Run lint
        run: npm run lint

      - name: Lint success
        if: success()
        run: echo 'Lint succeeded'

      - name: Lint failure
        if: failure()
        run: echo 'Lint failed'

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checkout-and-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node modules
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Run tests
        run: npm test

      - name: Test success
        if: success()
        run: echo 'Tests succeeded'

      - name: Test failure
        if: failure()
        run: echo 'Tests failed'

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node modules
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build application
        run: npm run build

      - name: Build success
        if: success()
        run: echo 'Pipeline succeeded'

      - name: Build failure
        if: failure()
        run: echo 'Pipeline failed'