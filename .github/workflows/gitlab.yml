name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: pipeshift-test-lab

jobs:
  install:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules/
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/
      
      - name: Run lint
        run: npm run lint

  unit-test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/
      
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    container:
      image: node:20
    needs: [lint, unit-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/
      
      - name: Build application
        run: npm run build