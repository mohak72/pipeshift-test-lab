# VALIDATE-002 T4: a safe job that passes first time.
#
# No secrets, no write permissions, no deploying actions — the classifier must
# call this SAFE and the verifier must report VERIFIED with no iteration.
name: Verify — safe and passing

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
