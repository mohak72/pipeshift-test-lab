# Source pipeline for migration testing.
version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  test:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Unit tests
          command: npm test

  build:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Build
          command: npm run build

workflows:
  ci:
    jobs:
      - test
      - build:
          requires:
            - test
